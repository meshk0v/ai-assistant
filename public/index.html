<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
  <title>ИИ-ассистент</title>
  <meta name="description" content="Задайте вопрос ИИ-ассистенту и получите ответ за секунды">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b5bd6'/%3E%3Cpath d='M16 7l2.2 6.8L25 16l-6.8 2.2L16 25l-2.2-6.8L7 16l6.8-2.2z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="История чатов">
      <div class="sidebar__head">
        <div class="brand">
          <span class="brand__logo" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3l1.9 6.1L20 11l-6.1 1.9L12 19l-1.9-6.1L4 11l6.1-1.9z"/></svg>
          </span>
          <span class="brand__name">Ассистент</span>
        </div>
        <button class="icon-btn sidebar__close" id="closeSidebar" aria-label="Закрыть меню">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <button class="new-chat" id="newChat">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Новый чат
      </button>
      <div class="sidebar__label">История</div>
      <nav class="chat-list" id="chatList"></nav>
      <p class="chat-list__empty" id="chatListEmpty">Здесь появятся ваши диалоги</p>
    </aside>
    <div class="backdrop" id="backdrop" hidden></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn topbar__menu" id="openSidebar" aria-label="Открыть меню">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1 class="topbar__title" id="chatTitle">Новый чат</h1>
        <span class="status" id="status" title="Подключённая модель">
          <span class="status__dot"></span><span id="statusText">…</span>
        </span>
        <button class="icon-btn" id="themeToggle" aria-label="Сменить тему">
          <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg>
        </button>
      </header>

      <section class="scroller" id="scroller">
        <div class="welcome" id="welcome">
          <div class="welcome__badge" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3l1.9 6.1L20 11l-6.1 1.9L12 19l-1.9-6.1L4 11l6.1-1.9z"/></svg>
          </div>
          <h2 class="welcome__title">Здравствуйте! Чем могу помочь?</h2>
          <p class="welcome__text">Я ИИ-ассистент: отвечу на вопросы, объясню сложное простыми словами, помогу с текстом или кодом.</p>
          <div class="suggestions">
            <button class="suggestion" data-prompt="Объясни простыми словами, как работает искусственный интеллект">
              <span class="suggestion__title">Объясни простыми словами</span>
              <span class="suggestion__text">как работает искусственный интеллект</span>
            </button>
            <button class="suggestion" data-prompt="Составь план изучения JavaScript на месяц для начинающего">
              <span class="suggestion__title">Составь план</span>
              <span class="suggestion__text">изучения JavaScript на месяц</span>
            </button>
            <button class="suggestion" data-prompt="Помоги написать вежливое письмо с просьбой перенести встречу">
              <span class="suggestion__title">Помоги написать</span>
              <span class="suggestion__text">письмо о переносе встречи</span>
            </button>
            <button class="suggestion" data-prompt="Предложи 5 идей для выходных в городе">
              <span class="suggestion__title">Предложи идеи</span>
              <span class="suggestion__text">чем заняться на выходных</span>
            </button>
          </div>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
      </section>

      <footer class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Задайте вопрос…" aria-label="Сообщение" maxlength="20000"></textarea>
          <button type="submit" class="send" id="send" aria-label="Отправить" disabled>
            <svg class="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            <svg class="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
          </button>
        </form>
        <p class="composer__hint">Enter — отправить, Shift+Enter — новая строка. ИИ может ошибаться — проверяйте важное.</p>
      </footer>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="markdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
